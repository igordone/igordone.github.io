<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Ears -->
  <rect x="2" y="1" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="1" width="1" height="1" fill="#FFFFFF"/>
  <rect x="2" y="2" width="2" height="1" fill="#18181B"/>
  <rect x="12" y="2" width="2" height="1" fill="#18181B"/>

  <!-- Head Base - White / Light Gray -->
  <rect x="4" y="3" width="8" height="1" fill="#F4F4F5"/>
  <rect x="3" y="4" width="10" height="1" fill="#F4F4F5"/>
  <rect x="2" y="5" width="12" height="4" fill="#F4F4F5"/>
  <rect x="3" y="9" width="10" height="1" fill="#F4F4F5"/>
  <rect x="4" y="10" width="8" height="1" fill="#F4F4F5"/>
  <rect x="5" y="11" width="6" height="1" fill="#E4E4E7"/>
  <rect x="6" y="12" width="4" height="1" fill="#D4D4D8"/>

  <!-- Distinctive Badger Black Stripes -->
  <!-- Left Stripe -->
  <rect x="4" y="3" width="2" height="1" fill="#18181B"/>
  <rect x="4" y="4" width="3" height="4" fill="#18181B"/>
  <rect x="5" y="8" width="2" height="1" fill="#18181B"/>

  <!-- Right Stripe -->
  <rect x="10" y="3" width="2" height="1" fill="#18181B"/>
  <rect x="9" y="4" width="3" height="4" fill="#18181B"/>
  <rect x="9" y="8" width="2" height="1" fill="#18181B"/>

  <!-- Eyes -->
  <rect x="5" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="10" y="6" width="1" height="1" fill="#FFFFFF"/>

  <!-- Snout / Nose -->
  <rect x="7" y="10" width="2" height="1" fill="#09090B"/>
  <rect x="7" y="11" width="2" height="1" fill="#18181B"/>
</svg>
